[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nil-pro-mcp"
version = "0.2.0"
description = "MCP server for NIL PRO college basketball analytics"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nil-pro-mcp = "nil_pro_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nil_pro_mcp"]
